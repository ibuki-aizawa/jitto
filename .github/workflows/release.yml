name: Release

# Pushing a tag such as v0.1.0 or v0.1.0-rc.1 builds the Windows binaries and
# creates a draft release. Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # Each binary is built on its own architecture, so that it can be run to check
  # it: an x64 runner cannot run an Arm64 binary.
  build:
    needs: test
    name: build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      EXE: jitto-windows-${{ matrix.arch }}.exe
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # To check that the tag is on main.

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not a version such as v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG points to a commit that is not on main"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir dist
          go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/$EXE" .

      - name: Check the binary
        run: |
          got="$("dist/$EXE" --version)"
          if [ "$got" != "jitto $VERSION" ]; then
            echo "--version printed '$got', want 'jitto $VERSION'"
            exit 1
          fi
          # Running it shows it works here, but an x64 binary would also run on
          # Arm under emulation.
          arch="$(go version -m "dist/$EXE" | awk '$2 == "GOARCH=${{ matrix.arch }}" { print "ok" }')"
          if [ "$arch" != ok ]; then
            echo "dist/$EXE is not built for ${{ matrix.arch }}:"
            go version -m "dist/$EXE"
            exit 1
          fi

      - name: Write license notices
        run: go run ./tools/notices "dist/$EXE" > "dist/THIRD_PARTY_NOTICES-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # One notices file serves both binaries, which link the same modules.
      - name: Merge license notices
        working-directory: dist
        run: |
          if ! cmp THIRD_PARTY_NOTICES-amd64.txt THIRD_PARTY_NOTICES-arm64.txt; then
            echo "The binaries link different modules:"
            diff THIRD_PARTY_NOTICES-amd64.txt THIRD_PARTY_NOTICES-arm64.txt || true
            exit 1
          fi
          mv THIRD_PARTY_NOTICES-amd64.txt THIRD_PARTY_NOTICES.txt
          rm THIRD_PARTY_NOTICES-arm64.txt

      - name: Write checksums
        working-directory: dist
        run: |
          for f in jitto-windows-amd64.exe jitto-windows-arm64.exe THIRD_PARTY_NOTICES.txt; do
            printf '%s  %s\n' "$(sha256sum < "$f" | cut -d ' ' -f 1)" "$f"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          {
            echo "## Install"
            echo
            echo "Download the file for your PC:"
            echo
            echo "- \`jitto-windows-amd64.exe\` for most PCs, with an Intel or AMD processor"
            echo "- \`jitto-windows-arm64.exe\` for Arm PCs, such as those with a Snapdragon processor"
            echo
            echo "To check, open Settings > System > About and look at \"System type\"."
            echo "Rename the file to \`jitto.exe\` if you like, and put it in a folder on your PATH."
            echo
            echo "The binaries are not code-signed, so Windows SmartScreen may warn when you run a downloaded copy."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --title "jitto ${TAG#v}" --notes-file notes.md)
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" \
            dist/jitto-windows-amd64.exe dist/jitto-windows-arm64.exe \
            dist/THIRD_PARTY_NOTICES.txt dist/SHA256SUMS
