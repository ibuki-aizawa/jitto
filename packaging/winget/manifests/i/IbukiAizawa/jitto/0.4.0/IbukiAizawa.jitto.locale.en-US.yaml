ShortDescription: Interactive jq with autocomplete from your actual data.
Description: |-
  jitto is an interactive jq for the console. It reads JSON from a file or standard input, shows the result of a jq expression while you type it, and suggests the keys that actually appear in your data at that point, even inside map() or .[] | .... Ctrl+T lists example filters that fit the result, such as map(select(.status == "shipped")), made from your keys and values. The result is colored like jq, and -r (or Alt+R) writes strings without quotes.
  Press Enter to print the result to stdout and the expression to stderr, so the result can be piped to the next command. jitto is a single binary, does not need jq installed, and never connects to the network.
