name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before building.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }})
    # Each architecture is tested on its own hardware: the release ships both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # gofmt requires LF, and Git on Windows runners checks out with CRLF by default.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # An x64 Go on the Arm runner would build and test x64 binaries under
      # emulation, and the arm64 tests would prove nothing.
      - name: Check the architecture
        run: |
          got="$(go env GOARCH)"
          if [ "$got" != "${{ matrix.arch }}" ]; then
            echo "Go builds for $got here, want ${{ matrix.arch }}"
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e

      - name: Unit tests
        run: go test ./...

      - name: E2E tests
        run: go test -tags e2e ./e2e -v

      # Fails if a dependency of the release binary has a missing or unknown license.
      # The dependencies do not depend on the architecture, so one runner is enough.
      - name: Check licenses
        if: matrix.arch == 'amd64'
        run: |
          CGO_ENABLED=0 go build -trimpath -o jitto.exe .
          go run ./tools/notices jitto.exe > THIRD_PARTY_NOTICES.txt
          head -n 40 THIRD_PARTY_NOTICES.txt

      # macOS and Linux are not released yet, but should keep compiling.
      - name: Build for other platforms
        if: matrix.arch == 'amd64'
        run: |
          GOOS=linux go build -o /dev/null .
          GOOS=darwin go build -o /dev/null .
