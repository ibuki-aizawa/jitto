name: Release

# Pushing a tag such as v0.1.0 or v0.1.0-rc.1 builds the Windows binary and
# creates a draft release. Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      EXE: jitto-windows-amd64.exe
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # To check that the tag is on main.

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not a version such as v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG points to a commit that is not on main"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir dist
          go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/$EXE" .

      - name: Check the binary
        run: |
          got="$("dist/$EXE" --version)"
          if [ "$got" != "jitto $VERSION" ]; then
            echo "--version printed '$got', want 'jitto $VERSION'"
            exit 1
          fi

      - name: Write license notices
        run: go run ./tools/notices "dist/$EXE" > dist/THIRD_PARTY_NOTICES.txt

      - name: Write checksums
        working-directory: dist
        run: |
          for f in "$EXE" THIRD_PARTY_NOTICES.txt; do
            printf '%s  %s\n' "$(sha256sum < "$f" | cut -d ' ' -f 1)" "$f"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          {
            echo "## Install"
            echo
            echo "Download \`$EXE\`, rename it to \`jitto.exe\` if you like, and put it in a folder on your PATH."
            echo
            echo "The binary is not code-signed, so Windows SmartScreen may warn when you run a downloaded copy."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --title "jitto $VERSION" --notes-file notes.md)
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" "dist/$EXE" dist/THIRD_PARTY_NOTICES.txt dist/SHA256SUMS
